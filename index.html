<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="app.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>Track Expenses</title>
</head>
<body>
  <main class="expense-tracker-dashboard">

  </main>

  <div id="add-transaction-form">
    <h5 class="add-transaction-form-heading">Add Transaction</h5>
    <input id="desc" placeholder="e.g Groceries">
    <input id="amount" type="number" placeholder="Amount">
    <select id="type">
      <option value="">--select transaction type--</option>
      <option value="expense">Expense</option>
      <option value="income">Income</option>
    </select>
    <select id="category">
      <option value="">--Select category--</option>
      <option>Food</option>
      <option>Transport</option>
      <option>Shopping</option>
      <option>Bills</option>
      <option>Income</option>
    </select>
    <button id="save-btn">Save</button>
  </div>
  <button id="add-transaction-btn">+ Add Transaction</button>

  <script src="app.js" type="module"></script>
</body>
</html>
